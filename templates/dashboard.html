<!DOCTYPE html>
<html>
<head>
<title>Gym Dashboard</title>
<style>
body{
 margin:0; padding:20px 8%; color:white; font-family:Arial;
 background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470');
 background-size: cover; background-attachment: fixed; min-height:100vh;
}
h1{color:#ffb703; font-size:40px; text-shadow: 2px 2px 10px #ffb703;}
.stats{display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:20px; margin-top:30px;}
.stat-card{
 background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
 padding:25px; border-radius:15px; border:1px solid #ffb703;
 border-left:5px solid #ffb703; transition:0.3s;
}
.stat-card:hover{transform: translateY(-10px); box-shadow: 0 10px 20px rgba(255,183,3,0.4); background: rgba(255,183,3,0.2);}
a{text-decoration:none; color:white}
.back{color:#ffb703}
</style>
</head>
<body>
<a href="/" class="back">← Home</a>
<h1>💪 GYM DASHBOARD</h1>
<p>Welcome to Admin Panel - Iron Fitness</p>
<div class="stats">
<a href="/members"><div class="stat-card"><h3>Total Members: {{ total_members }}</h3><p>Manage Members →</p></div></a>
<a href="/trainers"><div class="stat-card"><h3>Total Trainers: {{ total_trainers }}</h3><p>View Trainers →</p></div></a>
<a href="/plans"><div class="stat-card"><h3>Plans: {{ total_plans }}</h3><p>View Plans →</p></div></a>
<div class="stat-card" style="border-left-color:#00ff88"><h3>Revenue: ₹{{ total_revenue }}</h3><p>This Month 🔥</p></div>
</div>
</body>
</html>
